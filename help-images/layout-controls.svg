<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="260" rx="10" fill="#323a4a"/>

  <!-- Top-Down mini tree (left half) -->
  <rect x="20" y="20" width="280" height="180" rx="8" fill="#111827" stroke="#26313a"/>
  <text x="160" y="42" text-anchor="middle" fill="#e6eef8" font-size="13" font-weight="bold">↕ Top-Down</text>
  <path d="M160 66 V 84" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <path d="M100 108 H 220 M100 108 V 84 M220 108 V 84" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <rect x="128" y="52" width="64" height="26" rx="4" fill="#0074d9"/>
  <rect x="68" y="108" width="64" height="26" rx="4" fill="#00a67e"/>
  <rect x="188" y="108" width="64" height="26" rx="4" fill="#00a67e"/>
  <text x="160" y="160" text-anchor="middle" fill="#9aa6b2" font-size="11">tree grows downward</text>

  <!-- Left-Right mini tree (right half) -->
  <rect x="340" y="20" width="280" height="180" rx="8" fill="#111827" stroke="#26313a"/>
  <text x="480" y="42" text-anchor="middle" fill="#e6eef8" font-size="13" font-weight="bold">↔ Left-Right</text>
  <path d="M400 100 H 418" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <path d="M418 78 V 122 M418 78 H 460 M418 122 H 460" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <rect x="368" y="87" width="52" height="26" rx="4" fill="#0074d9"/>
  <rect x="460" y="65" width="64" height="26" rx="4" fill="#00a67e"/>
  <rect x="460" y="109" width="64" height="26" rx="4" fill="#00a67e"/>
  <text x="480" y="160" text-anchor="middle" fill="#9aa6b2" font-size="11">tree grows rightward</text>

  <line x1="20" y1="216" x2="620" y2="216" stroke="#26313a" stroke-width="1"/>
  <text x="20" y="238" fill="#9aa6b2" font-size="12">Centered balances siblings like an org chart; Indented lists them like an outline.</text>
</svg>
