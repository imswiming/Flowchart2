<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="320" rx="10" fill="#0f1724"/>
  <rect x="0" y="0" width="640" height="320" rx="10" fill="none" stroke="#26313a"/>

  <!-- tab row -->
  <rect x="20" y="20" width="96" height="28" rx="14" fill="none" stroke="#26313a" stroke-width="1.5"/>
  <text x="68" y="38" text-anchor="middle" fill="#9aa6b2" font-size="12" font-weight="bold">Questions</text>

  <rect x="126" y="20" width="112" height="28" rx="14" fill="#00a67e"/>
  <text x="182" y="38" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Pugh Matrix</text>

  <rect x="248" y="20" width="80" height="28" rx="14" fill="none" stroke="#26313a" stroke-width="1.5"/>
  <text x="288" y="38" text-anchor="middle" fill="#9aa6b2" font-size="12" font-weight="bold">Notes</text>

  <!-- mini pugh table -->
  <g font-size="12">
    <rect x="20" y="66" width="600" height="26" fill="#0f1724"/>
    <text x="28" y="84" fill="#9aa6b2" font-size="11" font-weight="bold">CRITERIA</text>
    <text x="380" y="84" text-anchor="middle" fill="#9aa6b2" font-size="11" font-weight="bold">Cost</text>
    <text x="500" y="84" text-anchor="middle" fill="#9aa6b2" font-size="11" font-weight="bold">Speed</text>

    <line x1="20" y1="92" x2="620" y2="92" stroke="#26313a"/>
    <rect x="20" y="92" width="600" height="28" fill="#111827"/>
    <text x="28" y="111" fill="#e6eef8" font-size="12">Ease of setup</text>
    <text x="380" y="111" text-anchor="middle" fill="#e6eef8" font-size="12">4</text>
    <text x="500" y="111" text-anchor="middle" fill="#e6eef8" font-size="12">2</text>
    <line x1="20" y1="120" x2="620" y2="120" stroke="#26313a"/>

    <rect x="20" y="120" width="600" height="28" fill="#111827"/>
    <text x="28" y="139" fill="#e6eef8" font-size="12">Long-term cost</text>
    <text x="380" y="139" text-anchor="middle" fill="#e6eef8" font-size="12">2</text>
    <text x="500" y="139" text-anchor="middle" fill="#e6eef8" font-size="12">5</text>
    <line x1="20" y1="148" x2="620" y2="148" stroke="#26313a"/>

    <rect x="20" y="148" width="600" height="28" fill="#0f1724"/>
    <text x="28" y="167" fill="#e6eef8" font-size="12" font-weight="bold">Total Score</text>
    <text x="380" y="167" text-anchor="middle" fill="#e6eef8" font-size="12" font-weight="bold">6</text>
    <text x="500" y="167" text-anchor="middle" fill="#e6eef8" font-size="12" font-weight="bold">7</text>
    <line x1="20" y1="176" x2="620" y2="176" stroke="#26313a"/>
    <rect x="20" y="66" width="600" height="110" fill="none" stroke="#26313a"/>
    <line x1="340" y1="66" x2="340" y2="176" stroke="#26313a"/>
    <line x1="460" y1="66" x2="460" y2="176" stroke="#26313a"/>
  </g>

  <!-- notes outline snippet -->
  <line x1="20" y1="198" x2="620" y2="198" stroke="#26313a"/>
  <text x="20" y="220" fill="#9aa6b2" font-size="11" font-weight="bold" letter-spacing="1">NOTES</text>

  <circle cx="28" cy="238" r="2.5" fill="#e6eef8"/>
  <text x="40" y="242" fill="#e6eef8" font-size="12">Key research findings</text>

  <circle cx="48" cy="260" r="2.5" fill="#e6eef8"/>
  <text x="60" y="264" fill="#e6eef8" font-size="12">Users skip step 3 most often</text>

  <rect x="44" y="277" width="12" height="12" rx="2" fill="#00a67e"/>
  <path d="M47 283 l2.5 2.5 l5 -5.5" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <text x="62" y="287" fill="#9aa6b2" font-size="12" text-decoration="line-through">Interview 5 users</text>

  <text x="20" y="310" fill="#9aa6b2" font-size="11">Tab/Space to indent a bullet, Backspace to outdent - always visible below the tabs.</text>
</svg>
