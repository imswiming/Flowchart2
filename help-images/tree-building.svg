<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="280" rx="10" fill="#323a4a"/>

  <!-- connecting lines from parent to the selected node and its two children -->
  <path d="M 320 66 V 90" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <path d="M 230 178 V 200 H 230" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>
  <path d="M 230 178 H 410 V 200" stroke="#9aa6b2" stroke-width="1.5" fill="none"/>

  <!-- parent placeholder above -->
  <rect x="270" y="34" width="100" height="32" rx="5" fill="#323a4a" stroke="#9aa6b2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- radial add buttons around the selected node -->
  <g>
    <circle cx="320" cy="98" r="17" fill="#111827" stroke="#00a67e" stroke-width="1.5"/>
    <text x="320" y="104" text-anchor="middle" fill="#00a67e" font-size="18" font-weight="bold">+</text>
  </g>
  <g>
    <circle cx="150" cy="140" r="17" fill="#111827" stroke="#00a67e" stroke-width="1.5"/>
    <text x="150" y="146" text-anchor="middle" fill="#00a67e" font-size="18" font-weight="bold">+</text>
  </g>
  <g>
    <circle cx="490" cy="140" r="17" fill="#111827" stroke="#00a67e" stroke-width="1.5"/>
    <text x="490" y="146" text-anchor="middle" fill="#00a67e" font-size="18" font-weight="bold">+</text>
  </g>
  <g>
    <circle cx="320" cy="182" r="17" fill="#111827" stroke="#00a67e" stroke-width="1.5"/>
    <text x="320" y="188" text-anchor="middle" fill="#00a67e" font-size="18" font-weight="bold">+</text>
  </g>

  <!-- the selected node -->
  <rect x="255" y="110" width="130" height="44" rx="6" fill="#0074d9" stroke="#e6eef8" stroke-width="2"/>
  <text x="320" y="137" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Selected node</text>

  <!-- two children below -->
  <rect x="175" y="200" width="110" height="38" rx="5" fill="#00a67e"/>
  <text x="230" y="224" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Child</text>
  <rect x="355" y="200" width="110" height="38" rx="5" fill="#323a4a" stroke="#9aa6b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="410" y="224" text-anchor="middle" fill="#9aa6b2" font-size="12">placeholder</text>

  <!-- callouts -->
  <text x="150" y="112" text-anchor="middle" fill="#e6eef8" font-size="11">add sibling</text>
  <text x="150" y="124" text-anchor="middle" fill="#e6eef8" font-size="11">before</text>
  <text x="490" y="112" text-anchor="middle" fill="#e6eef8" font-size="11">add sibling</text>
  <text x="490" y="124" text-anchor="middle" fill="#e6eef8" font-size="11">after</text>
  <text x="320" y="80" text-anchor="middle" fill="#e6eef8" font-size="11">add parent</text>
  <text x="277" y="186" text-anchor="end" fill="#e6eef8" font-size="11">add child</text>

  <text x="465" y="228" fill="#9aa6b2" font-size="11">click to fill in</text>
</svg>
